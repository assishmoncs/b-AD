<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>b-AD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="root">

    <div class="header">
      <div class="logo-block">
        <div class="logo-hex">⬡</div>
        <div class="logo-text">b<span>-</span>AD</div>
        <div class="logo-version">v3</div>
      </div>
      <div class="status-block" id="statusBlock">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">ACTIVE</span>
      </div>
    </div>

    <div class="mode-strip" id="modeStrip">
      <span class="mode-icon" id="modeIcon">◉</span>
      <span class="mode-text" id="modeText">SCANNING…</span>
    </div>

    <div class="grid">
      <div class="tile tile-red">
        <div class="tile-label">ADS BLOCKED</div>
        <div class="tile-value" id="adsBlocked">0</div>
        <div class="tile-glyph">✕</div>
      </div>
      <div class="tile tile-amber">
        <div class="tile-label">TRACKERS</div>
        <div class="tile-value" id="trackersBlocked">0</div>
        <div class="tile-glyph">◎</div>
      </div>
      <div class="tile tile-blue">
        <div class="tile-label">BANDWIDTH</div>
        <div class="tile-value" id="bandwidthSaved">0 B</div>
        <div class="tile-glyph">▾</div>
      </div>
      <div class="tile tile-green">
        <div class="tile-label">TOP DOMAIN</div>
        <div class="tile-value tile-value--sm" id="topDomain">—</div>
        <div class="tile-glyph">★</div>
      </div>
    </div>

    <div class="bar-section">
      <div class="bar-header">
        <span class="bar-legend"><span class="dot dot-red"></span>Ads</span>
        <span class="bar-legend"><span class="dot dot-amber"></span>Trackers</span>
        <span class="bar-total" id="barTotal">0 total</span>
      </div>
      <div class="bar-track">
        <div class="bar-seg seg-red"   id="segAds"   style="width:0%"></div>
        <div class="bar-seg seg-amber" id="segTrack" style="width:0%"></div>
      </div>
    </div>

    <div class="domains-block">
      <div class="domains-head">
        <span>BLOCKED DOMAINS</span>
        <span class="domains-count" id="domainsCount">0</span>
      </div>
      <div class="domains-list" id="domainsList">
        <div class="domains-empty">No data — start browsing</div>
      </div>
    </div>

    <div class="footer">
      <button class="reset-btn" id="btnReset">↺ RESET STATS</button>
      <div class="footer-right">
        <span class="footer-shield">⬡</span>
        <span class="footer-copy">b-AD 3.0</span>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
